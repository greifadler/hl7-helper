<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HL7 Helper</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --line:#e2e5ea; --line2:#eef0f3; --text:#1c2230; --muted:#677084; --faint:#a0a7b4;
  --accent:#0d6b6b; --accent-soft:#e0f0ef; --seg:#0d6b6b; --zseg:#8646ad;
  --sel:#ffd74a; --sel-text:#1c2230; --selfield:#fff3c4; --hover:#e5ecfb; --hit:#c9e7ff;
  --del:#fde3e1; --del-strong:#f4a9a3; --add:#dcf3e3; --add-strong:#9edbb1; --chg-strong:#ffbf57;
  --ok:#1f8a52; --bad:#c0392b;
  --mono: ui-monospace, "JetBrains Mono", "Cascadia Code", "SF Mono", Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#13161b; --panel:#1a1e25; --line:#2a303a; --line2:#222730; --text:#e2e6ed; --muted:#97a0af; --faint:#5f6877;
    --accent:#4fc0b6; --accent-soft:#17312f; --seg:#5ccfc4; --zseg:#c591e8;
    --sel:#d9b52c; --sel-text:#111; --selfield:#3a3417; --hover:#22304a; --hit:#1c3c5a;
    --del:#432020; --del-strong:#7c3232; --add:#1b3a26; --add-strong:#2e6b43; --chg-strong:#a8781a;
    --ok:#4cc488; --bad:#ef7a6c;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;font-size:15px;letter-spacing:.2px}
.brand .logo{width:26px;height:26px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 11px var(--mono)}
.tabs{display:flex;gap:4px;background:var(--bg);padding:3px;border-radius:9px;border:1px solid var(--line)}
.tabs button{border:0;background:none;padding:5px 14px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:550}
.tabs button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.lang{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.lang button{border:0;background:none;padding:4px 10px;font-size:12px;font-weight:650;color:var(--muted);cursor:pointer;letter-spacing:.3px}
.lang button.on{background:var(--accent-soft);color:var(--accent)}
.gear{border:1px solid var(--line);background:var(--panel);border-radius:7px;width:32px;height:29px;cursor:pointer;color:var(--muted);display:grid;place-items:center;padding:0}
.gear:hover,.gear.on{color:var(--accent);border-color:var(--accent)}
.pop{position:absolute;right:20px;top:54px;width:310px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.16);padding:14px 14px 12px;z-index:40}
.pop label{display:block;font-size:11px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.5px;margin:0 0 5px}
.pop select{width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);margin-bottom:12px}
.pop .priv{font-size:12px;color:var(--muted);border-top:1px solid var(--line2);padding-top:10px;margin-top:2px}
main{padding:16px 20px 40px;max-width:1800px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--line2)}
.btn{border:1px solid var(--line);background:var(--panel);padding:4px 11px;border-radius:7px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.sm{padding:2px 8px;font-size:12px}
.chk{display:inline-flex;align-items:center;gap:5px;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
.sp-flex{flex:1}
.versel{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;white-space:nowrap}
.versel select{padding:2px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-size:12.5px}
textarea.hl7in{display:block;width:100%;min-height:140px;height:150px;resize:vertical;border:0;border-radius:10px 10px 0 0;padding:10px 12px;background:transparent;font:12.5px/1.55 var(--mono);white-space:pre;overflow:auto;outline:none}
textarea.hl7in::placeholder{color:var(--faint)}
.lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:8px 12px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 12px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12.5px;max-width:420px}
.chip b{display:block;font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.chip span{font-family:var(--mono)}
.chip small{color:var(--muted);font-family:var(--sans);margin-left:4px}
.chip.warn{border-color:#e0a03a;background:rgba(224,160,58,.1)}
.chip.good{border-color:rgba(31,138,82,.45)}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:14px;align-items:start}
@media (max-width:1100px){.workspace{grid-template-columns:1fr}}
.viewhead{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.seg-toggle{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg-toggle button{border:0;background:none;padding:3px 10px;cursor:pointer;color:var(--muted);font-size:13px}
.seg-toggle button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.msgview{padding:6px 0;font:12.5px/1.75 var(--mono);overflow-x:auto}
.ln{display:grid;grid-template-columns:42px minmax(0,1fr);padding:0 12px 0 0}
.ln:hover{background:var(--line2)}
.ln .no{color:var(--faint);text-align:right;padding-right:12px;user-select:none;font-size:11px;padding-top:1px}
.ln .tx{white-space:pre-wrap;word-break:break-all}
.sg{font-weight:700;color:var(--seg);cursor:pointer}
.sg.z{color:var(--zseg)}
.sp{color:var(--faint)}
.fnum{font-size:9px;color:var(--accent);vertical-align:super;line-height:0;margin:0 1px 0 0;opacity:.8;user-select:none}
.lf{cursor:pointer;border-radius:3px;transition:background .08s}
.lf:hover{background:var(--hover);outline:1px solid var(--hover)}
.lf.em{display:inline-block;min-width:0}
.fd.sf .lf{background:var(--selfield)}
.lf.hit{background:var(--hit)}
.lf.sel,.fd.sf .lf.sel{background:var(--sel);color:var(--sel-text);outline:1px solid var(--sel)}
.lf.sel.em{min-width:7px;height:1.1em;vertical-align:-2px}
.lf.fs,.lf.enc{color:var(--muted)}
.more{color:var(--muted);font-style:italic;font-family:var(--sans);font-size:11px}
.bad{color:var(--bad);text-decoration:wavy underline;text-decoration-thickness:1px}
.empty-state{padding:40px 20px;text-align:center;color:var(--muted)}
.empty-state b{color:var(--text)}
.listwrap{padding:0 0 6px}
.filter{width:100%;border:1px solid var(--line);border-radius:7px;padding:5px 9px;background:var(--bg)}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{position:sticky;top:0;background:var(--panel);text-align:left;font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:4px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
table.t td.p{font-family:var(--mono);white-space:nowrap;color:var(--accent);font-weight:600}
table.t td.v{font-family:var(--mono);word-break:break-all}
table.t .ty{font-family:var(--mono);color:var(--muted);font-size:11px}
table.t tr[data-pick]{cursor:pointer}
table.t tr[data-pick]:hover td{background:var(--hover)}
table.t tr.cur td{background:var(--selfield)}
table.t tr.mt td{color:var(--faint)}
table.t tr.sub td.p{padding-left:22px;font-weight:500}
.inspector{position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto}
.ib{padding:12px 14px;border-bottom:1px solid var(--line2)}
.ib:last-child{border-bottom:0}
.ib h4{margin:0 0 8px;font-size:11px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.ib h4 .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500}
.path{display:flex;align-items:center;gap:10px}
.path .big{font:700 24px/1.1 var(--mono);color:var(--accent);word-break:break-all}
.path .btn{margin-left:auto}
.alt{font-size:12px;color:var(--muted);margin-top:4px;font-family:var(--mono)}
.crumb{margin-top:10px;font-size:13px;line-height:1.7}
.crumb .lvl{display:flex;gap:7px;align-items:baseline}
.crumb .lvl .n{font:600 11px var(--mono);color:var(--muted);min-width:36px}
.crumb code{font:11px var(--mono);background:var(--line2);border-radius:4px;padding:0 5px;color:var(--muted)}
.crumb .lvl.leaf{font-weight:600}
.val{margin:0;font:12.5px/1.5 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;white-space:pre-wrap;word-break:break-all;max-height:240px;overflow:auto}
.val.empty{color:var(--faint);font-style:italic;font-family:var(--sans)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:12.5px;margin-top:10px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--mono);word-break:break-word}
.kv dd.sans{font-family:var(--sans)}
.ok{color:var(--ok);font-weight:600}
.nok{color:var(--bad);font-weight:600}
.qrow{display:flex;gap:6px}
.qrow input{flex:1;border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:var(--bg);font-family:var(--mono)}
.qres{margin-top:8px;font-size:12.5px}
.qres div[data-pick]{display:flex;gap:10px;padding:3px 6px;border-radius:5px;cursor:pointer;font-family:var(--mono)}
.qres div[data-pick]:hover{background:var(--hover)}
.qres .p{color:var(--accent);font-weight:600;white-space:nowrap}
.qres .v{word-break:break-all}
.hint{color:var(--muted);font-size:12.5px}
.hint code{font-family:var(--mono);background:var(--line2);padding:0 4px;border-radius:4px}
.badge{display:inline-block;font-size:11px;font-weight:600;border-radius:5px;padding:1px 7px}
.badge.chg{background:var(--chg-strong);color:#3d2a00}
.badge.same{background:var(--add);color:var(--text)}
.badge.del{background:var(--del-strong);color:#3d0000}
.badge.add{background:var(--add-strong);color:#00290f}
.cmp-inputs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:800px){.cmp-inputs{grid-template-columns:1fr}}
.cmpview{font:12.5px/1.7 var(--mono);padding:4px 0}
.crow{display:grid;grid-template-columns:34px minmax(0,1fr) 34px minmax(0,1fr);border-bottom:1px solid var(--line2)}
.crow .no{color:var(--faint);text-align:right;padding:1px 8px 0 0;user-select:none;font-size:11px}
.crow .cell{white-space:pre-wrap;word-break:break-all;padding:2px 10px 2px 2px;min-height:1.7em}
.crow .cell.a{border-right:1px solid var(--line)}
.crow.onlyA .cell.a{background:var(--del)}
.crow.onlyA .cell.b{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line2) 6px 7px)}
.crow.onlyB .cell.b{background:var(--add)}
.crow.onlyB .cell.a{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line2) 6px 7px)}
.crow.diff .no{color:#d48a12;font-weight:700}
.cmpview.only .crow.same{display:none}
.lf.df{background:var(--chg-strong);color:#2b1d00}
.lf.df.em{min-width:7px;height:1.1em;vertical-align:-2px}
.cmphead{display:grid;grid-template-columns:34px minmax(0,1fr) 34px minmax(0,1fr);font:600 11px var(--sans);color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--line)}
.cmphead div{padding:7px 2px}
.dlist div[data-dpick]{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:12.5px;border-bottom:1px solid var(--line2)}
.dlist div[data-dpick]:hover{background:var(--hover)}
.dlist div.cur{background:var(--selfield)}
.dlist .p{font:600 12.5px var(--mono);color:var(--accent);white-space:nowrap}
.dlist .nm{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlist .vv{grid-column:1/-1;font-family:var(--mono);font-size:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dlist .va{background:var(--del);padding:0 5px;border-radius:4px;word-break:break-all}
.dlist .vb{background:var(--add);padding:0 5px;border-radius:4px;word-break:break-all}
.dlist .arrow{color:var(--faint)}
.vcmp{display:grid;grid-template-columns:22px 1fr;gap:6px 8px;align-items:start}
.vcmp .tag{font:700 11px var(--mono);color:var(--muted);padding-top:9px}
.vcmp .val.a{border-color:var(--del-strong)}
.vcmp .val.b{border-color:var(--add-strong)}
.ignore-in{border:1px solid var(--line);border-radius:6px;padding:3px 8px;width:200px;background:var(--bg);font-family:var(--mono);font-size:12.5px}
#tip{position:fixed;z-index:50;pointer-events:none;background:#1c2230;color:#eef1f6;border-radius:7px;padding:7px 10px;font-size:12px;max-width:380px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:none;line-height:1.4}
#tip .tp{font:700 13px var(--mono);color:#7fe0d6}
#tip .tn{color:#c9cfdb}
#tip .tv{font-family:var(--mono);color:#fff;margin-top:3px;word-break:break-all;max-height:4.2em;overflow:hidden}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#1c2230;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:60}
#toast.on{opacity:1;transform:translateX(-50%)}
.hidden{display:none!important}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">HL7</div>HL7 Helper</div>
  <nav class="tabs">
    <button data-tab="analyze" class="on" data-i18n="tab_analyze"></button>
    <button data-tab="compare" data-i18n="tab_compare"></button>
  </nav>
  <div class="hdr-right">
    <div class="lang" role="group" aria-label="Sprache / Language">
      <button data-lang="de">DE</button>
      <button data-lang="en">EN</button>
    </div>
    <button class="gear" id="gearBtn" data-i18n-title="settings" aria-haspopup="true">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
  <div id="pop" class="pop hidden">
    <label for="region" data-i18n="set_region"></label>
    <select id="region">
      <option value="auto" data-i18n="reg_auto"></option>
      <option value="DE" data-i18n="reg_DE"></option>
      <option value="AT" data-i18n="reg_AT"></option>
      <option value="CH" data-i18n="reg_CH"></option>
      <option value="INT" data-i18n="reg_INT"></option>
    </select>
    <label for="notation" data-i18n="set_notation"></label>
    <select id="notation">
      <option value="-" data-i18n="not_std"></option>
      <option value="." data-i18n="not_dot"></option>
      <option value="" data-i18n="not_short"></option>
    </select>
    <div class="priv" data-i18n="set_privacy"></div>
  </div>
</header>

<main>
  <!-- ======================= ANALYSE ======================= -->
  <section id="view-analyze">
    <div class="card">
      <textarea id="inA" class="hl7in" spellcheck="false" data-i18n-ph="ph_input"></textarea>
      <div class="toolbar">
        <button class="btn" data-sample="adtDE" data-i18n="sample_adt_de"></button>
        <button class="btn" data-sample="adtAT" data-i18n="sample_adt_at"></button>
        <button class="btn" data-sample="oruCH" data-i18n="sample_oru_ch"></button>
        <button class="btn" id="clearA" data-i18n="clear"></button>
        <select id="msgSel" class="btn hidden"></select>
        <span class="sp-flex"></span>
        <button class="btn" id="toCompare" data-i18n="to_compare" data-i18n-title="to_compare_t"></button>
        <button class="btn" id="copyJson" data-i18n="copy_json" data-i18n-title="copy_json_t"></button>
      </div>
    </div>

    <div id="chips" class="chips"></div>

    <div class="workspace">
      <div class="card">
        <div class="viewhead">
          <div class="seg-toggle">
            <button data-view="raw" class="on" data-i18n="view_msg"></button>
            <button data-view="list" data-i18n="view_table"></button>
          </div>
          <label class="versel"><span data-i18n="hl7ver"></span> <select class="verSel"></select></label>
          <label class="chk"><input type="checkbox" id="fieldNums"> <span data-i18n="field_nums"></span></label>
          <span class="sp-flex"></span>
          <span class="hint" data-i18n="hint_hover"></span>
        </div>
        <div id="viewRaw" class="msgview"></div>
        <div id="viewList" class="listwrap hidden">
          <div style="padding:8px 12px"><input id="listFilter" class="filter" data-i18n-ph="filter_ph"></div>
          <div id="listBody"></div>
        </div>
      </div>

      <aside class="card inspector">
        <div class="ib">
          <h4 data-i18n="search_path"></h4>
          <div class="qrow"><input id="query" data-i18n-ph="query_ph"></div>
          <div id="qres" class="qres"></div>
        </div>
        <div id="inspBody"></div>
      </aside>
    </div>
  </section>

  <!-- ======================= VERGLEICH ======================= -->
  <section id="view-compare" class="hidden">
    <div class="cmp-inputs">
      <div class="card">
        <div class="lbl" data-i18n="msgA"></div>
        <textarea id="cmpA" class="hl7in" spellcheck="false" data-i18n-ph="phA"></textarea>
      </div>
      <div class="card">
        <div class="lbl" data-i18n="msgB"></div>
        <textarea id="cmpB" class="hl7in" spellcheck="false" data-i18n-ph="phB"></textarea>
      </div>
    </div>
    <div class="card" style="margin-top:10px">
      <div class="toolbar" style="border-top:0">
        <button class="btn" id="cmpSample" data-i18n="load_sample"></button>
        <button class="btn" id="cmpSwap" data-i18n="swap"></button>
        <button class="btn" id="cmpClear" data-i18n="clear"></button>
        <label class="versel"><span data-i18n="hl7ver"></span> <select class="verSel"></select></label>
        <span class="sp-flex"></span>
        <label class="chk"><input type="checkbox" id="onlyDiff"> <span data-i18n="only_diff"></span></label>
        <label class="chk"><input type="checkbox" id="ignoreOn"> <span data-i18n="ignore"></span></label>
        <input id="ignoreList" class="ignore-in" data-i18n-title="ignore_t">
      </div>
    </div>

    <div id="cmpChips" class="chips"></div>

    <div class="workspace">
      <div class="card">
        <div class="viewhead">
          <div class="legend">
            <span><i style="background:var(--chg-strong)"></i><span data-i18n="changed"></span></span>
            <span><i style="background:var(--del-strong)"></i><span data-i18n="onlyA"></span></span>

   ===================================================================== */
const digits = s => s.split('').map(Number);
const xsum = p => p > 9 ? p - 9 : p;                   // cross sum for products ≤ 18
function chkKVNR(v){                                   // DE: letter→01..26, weights 1-2-1-2…, cross sums, mod 10
  const m = /^([A-Z])(\d{8})(\d)$/.exec(v); if(!m) return { fmt:false };
  const s = String(m[1].charCodeAt(0) - 64).padStart(2, '0') + m[2];
  let sum = 0; for(let i = 0; i < 10; i++) sum += xsum(+s[i] * (i % 2 ? 2 : 1));
  return { ok: sum % 10 === +m[3], exp: sum % 10 };
}
function chkIK(v){                                     // DE: digits 3–8, weights 2-1-2-1-2-1, cross sums, mod 10
  if(!/^\d{9}$/.test(v)) return { fmt:false };
  const d = digits(v); let sum = 0; for(let i = 2; i < 8; i++) sum += xsum(d[i] * (i % 2 ? 1 : 2));
  return { ok: sum % 10 === d[8], exp: sum % 10 };
}
function chkLANR(v){                                   // DE: digits 1–6, weights 4-9, 10 − (sum mod 10)
  if(!/^\d{9}$/.test(v)) return { fmt:false };
  const d = digits(v); let sum = 0; for(let i = 0; i < 6; i++) sum += d[i] * (i % 2 ? 9 : 4);
  const c = (10 - sum % 10) % 10; return { ok: c === d[6], exp: c };
}
function chkBSNR(v){ return /^\d{9}$/.test(v) ? { ok:true, fmtOnly:true } : { fmt:false }; }
function chkSVNR(v){                                   // AT: weights 3,7,9,–,5,8,4,2,1,6, mod 11 = 4th digit
  if(!/^\d{10}$/.test(v)) return { fmt:false };
  const w = [3,7,9,0,5,8,4,2,1,6]; const d = digits(v);
  const c = d.reduce((a, x, i) => a + x * w[i], 0) % 11;
  return c === 10 ? { ok:false, exp:'–' } : { ok: c === d[3], exp: c };
}
function chkEAN13(v){                                  // GS1: weights 1-3, 10 − (sum mod 10)
  if(!/^\d{13}$/.test(v)) return { fmt:false };
  const d = digits(v); let sum = 0; for(let i = 0; i < 12; i++) sum += d[i] * (i % 2 ? 3 : 1);
  const c = (10 - sum % 10) % 10; return { ok: c === d[12], exp: c };
}
function chkAHV(v){ return /^756\d{10}$/.test(v) ? chkEAN13(v) : { fmt:false }; }

   Helpers
   ===================================================================== */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

const LONG = 300;

const settings = {
  lang: (navigator.language || 'de').toLowerCase().startsWith('de') ? 'de' : 'en',
  notation:'-', region:'auto', version:'auto', fieldNums:true, hideEmpty:true, onlyDiff:false, ignoreOn:true, ignore:'MSH-7, MSH-10'

const SKEY = 'hl7helper.settings.v2';
function loadSettings(){ try{ Object.assign(settings, JSON.parse(localStorage.getItem(SKEY) || '{}')); }catch(e){} }
function saveSettings(){ try{ localStorage.setItem(SKEY, JSON.stringify(settings)); }catch(e){} }

function t(key, ...args){
  let s = (I18N[settings.lang] || I18N.de)[key];
  if(s == null) s = I18N.de[key] ?? key;
  args.forEach((a, i) => { s = s.split('{' + i + '}').join(a); });

}
const L = pair => Array.isArray(pair) ? (settings.lang === 'de' ? pair[0] : pair[1]) : pair;
function splitDef(s){

}
function segDesc(name){
  const sd = SEGS[name];

}
function dtName(type){ return type === 'varies' ? t('varies') : (DTNAME[type] || ''); }

function applyStatic(){
  document.documentElement.lang = settings.lang;
  $$('[data-i18n]').forEach(e => { e.textContent = t(e.dataset.i18n); });
  $$('[data-i18n-ph]').forEach(e => { e.placeholder = t(e.dataset.i18nPh); });

function toast(msg){ const el = $('#toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('on'), 1600); }
function copy(text, label){
  const done = () => toast(label ? t('copied_x', label) : t('copied'));
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){ toast(t('copy_fail')); } ta.remove(); };
  if(navigator.clipboard && window.isSecureContext !== false) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}

/* =====================================================================
   Parser
   ===================================================================== */
function splitMessages(text){
  text = (text || '').replace(/[\x0b\x1c]/g, '');
  const lines = text.split(/\r\n|\n|\r/).map(l => l.replace(/^\s+/, '').replace(/\s+$/, '')).filter(l => l !== '');
  const msgs = []; let cur = [];
  for(const l of lines){ if(/^MSH/.test(l) && cur.length){ msgs.push(cur); cur = []; } cur.push(l); }
  if(cur.length) msgs.push(cur);
  return msgs.map(parseMessage);
}
function parseField(raw, enc){
  return { raw, reps: raw.split(enc.r).map(rr => ({ raw: rr, comps: rr.split(enc.c).map(cc => ({ raw: cc, subs: cc.split(enc.s) })) })) };
}
function single(raw){ return { raw, special:true, reps:[{ raw, comps:[{ raw, subs:[raw] }] }] }; }
function parseMessage(lines){
  const enc = { f:'|', c:'^', r:'~', e:'\\', s:'&' };
  const hdr = lines.find(l => /^(MSH|FHS|BHS)/.test(l));
  if(hdr && hdr.length >= 4){
    enc.f = hdr[3];
    const p = hdr.split(enc.f)[1] || '';
    if(p[0]) enc.c = p[0]; if(p[1]) enc.r = p[1]; if(p[2]) enc.e = p[2]; if(p[3]) enc.s = p[3];
  }
  const msg = { segs:[], enc, counts:{} };
  lines.forEach(line => {
    const name = line.slice(0, 3);
    const valid = /^[A-Z][A-Z0-9]{2}$/.test(name) && (line.length === 3 || line[3] === enc.f);
    if(!valid){ msg.segs.push({ name:'???', invalid:true, line, fields:[], occ:0, msg }); return; }
    msg.counts[name] = (msg.counts[name] || 0) + 1;
    const parts = line.split(enc.f);
    const fields = [null];
    if(HEADER.has(name)){
      fields[1] = single(enc.f); fields[2] = single(parts[1] || '');
      for(let n = 2; n < parts.length; n++) fields[n+1] = parseField(parts[n], enc);
    } else for(let n = 1; n < parts.length; n++) fields[n] = parseField(parts[n], enc);
    msg.segs.push({ name, fields, occ: msg.counts[name], line, msg });
  });
  msg.segs.forEach(s => s.multi = (msg.counts[s.name] || 0) > 1);
  return msg;
}
function getVal(seg, f, r, c, s){
  const fd = seg && seg.fields[f]; if(!fd) return '';
  if(r == null) return fd.raw;
  const rp = fd.reps[r-1]; if(!rp) return '';
  if(c == null) return rp.raw;
  const cp = rp.comps[c-1]; if(!cp) return '';
  if(s == null) return cp.raw;
  return cp.subs[s-1] ?? '';
}
function decodeEsc(v, enc){
  const e = enc.e; if(!e || v.indexOf(e) < 0) return v;
  const re = new RegExp(rx(e) + '([^' + rx(e) + ']*)' + rx(e), 'g');
  return v.replace(re, (m, code) => {
    switch(code){ case 'F': return enc.f; case 'S': return enc.c; case 'T': return enc.s; case 'R': return enc.r; case 'E': return e; case '.br': return '\n'; case 'H': case 'N': return ''; }
    if(/^X([0-9A-Fa-f]{2})+$/.test(code)){ try{ return new TextDecoder().decode(new Uint8Array(code.slice(1).match(/../g).map(h => parseInt(h, 16)))); }catch(err){ return m; } }
    if(/^\.sp\d*$/.test(code)) return '\n';
    if(/^\.(in|ti|ce|fi|nf|sk)/.test(code)) return '';
    return m;
  });
}
function fmtDate(v){
  const m = /^(\d{4})(\d{2})?(\d{2})?(\d{2})?(\d{2})?(\d{2})?(?:\.(\d{1,4}))?([+-]\d{4})?$/.exec((v || '').trim());
  if(!m) return null;
  const [, Y, M, D, h, mi, s, fr, tz] = m;
  if(M && (+M < 1 || +M > 12)) return null;
  if(D && (+D < 1 || +D > 31)) return null;
  if(h && +h > 23) return null;
  let out = settings.lang === 'de' ? (D ? D + '.' : '') + (M ? M + '.' : '') + Y : Y + (M ? '-' + M : '') + (D ? '-' + D : '');
  if(h) out += ' ' + h + ':' + (mi || '00') + (s ? ':' + s : '') + (fr ? '.' + fr : '') + t('uhr');
  if(tz) out += ' (UTC' + tz.slice(0, 3) + ':' + tz.slice(3) + ')';
  return out;
}

/* =====================================================================
   Version & region
   ===================================================================== */
function mshOf(msg){ return msg && msg.segs.find(s => s.name === 'MSH'); }
function detectedVersion(msg){ const msh = mshOf(msg); return msh ? getVal(msh, 12, 1, 1, null).trim() : ''; }
function verOf(msg){ return settings.version !== 'auto' ? settings.version : (detectedVersion(msg) || '2.5'); }
function verNum(v){ const p = String(v).split('.').map(x => parseInt(x, 10) || 0); return (p[0] || 0) * 100 + (p[1] || 0) * 10 + (p[2] || 0); }
function mapType(type, ver){
  if(!type) return type;
  const n = verNum(ver);
  if(n >= 260 && type === 'CE') return 'CWE';     // v2.6+: CE largely replaced by CWE
  if(n >= 270 && type === 'TS') return 'DTM';     // v2.7+: TS withdrawn, DTM used directly
  return type;
}
const REGION_CODES = { DEU:'DE', DE:'DE', D:'DE', AUT:'AT', AT:'AT', A:'AT', CHE:'CH', CH:'CH', LIE:'CH' };
function regionOf(msg){
  if(settings.region !== 'auto') return { code: settings.region === 'INT' ? null : settings.region, via:'manual' };
  if(!msg) return { code:null, via:'none' };
  const msh = mshOf(msg);
  if(msh){
    const c17 = REGION_CODES[getVal(msh, 17, 1, 1, null).trim().toUpperCase()];
    if(c17) return { code:c17, via:'msh17' };
    const c12 = REGION_CODES[getVal(msh, 12, 1, 2, 1).trim().toUpperCase()];
    if(c12) return { code:c12, via:'msh12' };
  }
  const all = msg.segs.map(s => s.line).join('\n');
  if(all.includes('1.2.276.0.')) return { code:'DE', via:'oid' };
  if(all.includes('1.2.40.0.')) return { code:'AT', via:'oid' };
  if(all.includes('2.16.756.') || all.includes('1.2.756.')) return { code:'CH', via:'oid' };
  return { code:null, via:'none' };
}

/* Field / component description */
function describe(seg, f, c, s){
  const ver = verOf(seg.msg);
  const out = { segDesc: segDesc(seg.name) };
  const sd = SEGS[seg.name];
  let fd = sd && sd.f[f-1] ? splitDef(sd.f[f-1]) : null;
  if(fd){
    fd.type = mapType(fd.type, ver);
    if(seg.name === 'OBX' && f === 5){ const vt = getVal(seg, 2, 1, 1, 1).trim(); if(vt) fd.type = mapType(vt, ver); }
  }
  out.field = fd;
  if(c != null && fd && DT[fd.type]){ out.comp = splitDef(DT[fd.type][c-1]); if(out.comp) out.comp.type = mapType(out.comp.type, ver); }
  if(s != null && out.comp && DT[out.comp.type]){ out.sub = splitDef(DT[out.comp.type][s-1]); if(out.sub) out.sub.type = mapType(out.sub.type, ver); }
  return out;
}
function leafType(d, c, s){
  let ty = null;
  if(s != null && d.sub) ty = d.sub.type;
  else if(c != null && d.comp) ty = d.comp.type;
  else if(c == null && d.field) ty = d.field.type;
  if(ty && DT[ty] && (c == null || s == null)){ const first = splitDef(DT[ty][0]); if(first) ty = DT[first.type] ? splitDef(DT[first.type][0]).type : first.type; }
  return ty;
}
function shortName(seg, f, c, s){
  const d = describe(seg, f, c, s);
  const parts = [d.field ? d.field.name : (seg.name[0] === 'Z' ? t('zfield') : t('field_n', f))];
  if(c != null) parts.push(d.comp ? d.comp.name : t('comp_n', c));
  if(s != null) parts.push(d.sub ? d.sub.name : t('sub_n', s));
  return parts.join(' › ');
}
function fmtPath(segLbl, f, r, c, s){
  let p = segLbl + settings.notation + f;
  if(r != null) p += '[' + r + ']';
  if(c != null) p += '.' + c;
  if(s != null) p += '.' + s;
  return p;
}
function segLabel(seg, withOcc){ return seg.name + (withOcc && seg.multi ? '[' + seg.occ + ']' : ''); }
function leafSel(segs, f, r, c, s){
  let incS = false, incC = false, multiRep = false;
  for(const seg of segs){
    const fd = seg && seg.fields[f]; if(!fd) continue;
    if(fd.reps.length > 1) multiRep = true;
    const rp = fd.reps[r-1]; if(!rp) continue;
    if(rp.comps.length > 1) incC = true;
    const cp = rp.comps[c-1]; if(cp && cp.subs.length > 1) incS = true;
  }
  if(incS) incC = true;
  if(c > 1) incC = true;
  if(s > 1){ incS = true; incC = true; }
  return { f, r, c: incC ? c : null, s: incS ? s : null, showRep: multiRep || r > 1 };
}
function tableLookup(seg, f, c, v){
  const key = seg.name + '-' + f;
  const id = TABLE_MAP[key + '.' + (c || 1)] || ((c == null || c === 1) ? TABLE_MAP[key] : null);
  if(!id) return null;
  const reg = regionOf(seg.msg).code;
  const regTab = reg && TABLES_REGION[reg] && TABLES_REGION[reg][id];
  const tab = regTab || TABLES[id]; if(!tab) return null;
  const src = regTab ? 'HL7 Austria' : TABLE_SRC[id];
  const hit = tab[v.trim()];
  return { table: id, src, text: hit ? L(hit) : null };
}

/* National identifiers */
function idParts(seg, f, r, type){
  const g = (c, s) => getVal(seg, f, r, c, s);
  switch(type){
    case 'CX':  return { id:g(1,null), ns:g(4,1), uid:g(4,2), code:g(5,null) };
    case 'XCN': return { id:g(1,null), ns:g(9,1), uid:g(9,2), code:g(13,null) };
    case 'CN':  return { id:g(1,null), ns:g(9,1), uid:g(9,2), code:'' };
    case 'CNN': return { id:g(1,null), ns:g(9,null), uid:g(10,null), code:'' };
    case 'XON': { const id10 = g(10,null); return { id: id10 || g(3,null), ns:g(6,1), uid:g(6,2), code:g(7,null) }; }
    case 'EI':  return { id:g(1,null), ns:g(2,null), uid:g(3,null), code:'' };
    default:    return { id:getVal(seg, f, r, null, null), ns:'', uid:'', code:'' };
  }
}
function identifyId(seg, f, r){
  if(seg.invalid || !seg.fields[f]) return null;
  const d = describe(seg, f, null, null); const type = d.field ? d.field.type : null;
  const isId = ID_FIELD_TYPES.has(type), isPlain = PLAIN_ID_FIELDS.has(seg.name + '-' + f);
  if(!isId && !isPlain) return null;
  const p = idParts(seg, f, r, isId ? type : 'plain');
  const val = (p.id || '').trim(); if(!val) return null;
  const region = regionOf(seg.msg).code;
  let kind = null, via = null, viaArg = '';
  for(const x of [p.uid, p.ns]){ const o = (x || '').replace(/^urn:oid:/i, '').trim(); if(ID_OID[o]){ kind = ID_OID[o]; via = 'oid'; viaArg = o; break; } }
  if(!kind){
    for(const x of [p.code, p.ns]){
      const k = (x || '').trim().toUpperCase();
      const hit = ID_CODE[k] || (region === 'AT' && k === 'SVNR' ? 'svnr' : null);
      if(hit){ kind = hit; via = 'code'; viaArg = x.trim(); break; }
    }
  }
  const clean = val.replace(/[\s.]/g, '');
  if(!kind){
    if(/^[A-Z]\d{9}$/.test(clean) && chkKVNR(clean).ok) kind = 'kvnr';
    else if(/^756\d{10}$/.test(clean) && chkEAN13(clean).ok) kind = 'ahv';
    else if(region === 'AT' && /^\d{10}$/.test(clean) && chkSVNR(clean).ok) kind = 'svnr';
    else if(region === 'DE' && seg.name === 'IN1' && f === 3 && chkIK(clean).ok) kind = 'ik';
    if(kind) via = 'fmt';
  }
  if(!kind) return null;
  const sys = IDSYS[kind];
  return { kind, via, viaArg, value: val, res: sys.chk ? sys.chk(clean) : null };
}
function idResultText(res){
  if(!res) return '';
  if(res.fmt === false) return `<span class="nok">${esc(t('id_format'))}</span>`;
  if(res.fmtOnly) return `<span class="ok">${esc(t('id_fmt_ok'))}</span>`;
  return res.ok ? `<span class="ok">${esc(t('id_valid'))}</span>` : `<span class="nok">${esc(t('id_invalid', res.exp))}</span>`;
}
function scanIds(msg){
  const out = [];
  msg.segs.forEach((seg, si) => {
    if(seg.invalid) return;
    for(let f = 1; f < seg.fields.length; f++){
      const fd = seg.fields[f]; if(!fd || fd.special) continue;
      fd.reps.forEach((_, ri) => { const id = identifyId(seg, f, ri + 1); if(id && id.res && !id.res.fmtOnly) out.push({ si, f, r: ri + 1, seg, id, multiRep: fd.reps.length > 1 }); });
    }
  });
  return out;
}

/* =====================================================================
   Segment line rendering (shared by Analyze & Compare)
   ===================================================================== */
function segHTML(seg, si, side, enc, diff, fieldNums){
  if(seg.invalid) return `<span class="bad" title="${esc(t('invalid_line'))}">${esc(seg.line)}</span>`;
  const hdr = HEADER.has(seg.name);
  const sp = ch => `<span class="sp">${esc(ch)}</span>`;
  const fnum = f => fieldNums ? `<span class="fnum">${f}</span>` : '';
  const leaf = (f, r, c, s, v, cls) => {
    const d = diff && diff.has(f + ':' + r + ':' + c + ':' + s);
    const txt = v.length > LONG ? esc(v.slice(0, LONG)) + `<span class="more">${esc(t('more_chars', v.length - LONG))}</span>` : esc(v);
    return `<span class="lf${v === '' ? ' em' : ''}${d ? ' df' : ''}${cls ? ' ' + cls : ''}" data-k="${side}:${si}:${f}:${r}:${c}:${s}">${txt}</span>`;
  };
  let h = `<span class="sg${seg.name[0] === 'Z' ? ' z' : ''}" data-sg="${side}:${si}">${seg.name}</span>`;
  for(let f = 1; f < seg.fields.length; f++){
    const fd = seg.fields[f]; if(!fd) continue;
    if(hdr && f === 1){ h += fnum(1) + `<span class="fd" data-f="${side}:${si}:1">${leaf(1,1,1,1,enc.f,'fs')}</span>`; continue; }
    if(!(hdr && f === 2)) h += sp(enc.f);
    h += (fd.raw !== '' ? fnum(f) : '') + `<span class="fd" data-f="${side}:${si}:${f}">`;
    if(fd.special) h += leaf(f, 1, 1, 1, fd.raw, 'enc');
    else h += fd.reps.map((rp, ri) => rp.comps.map((cp, ci) => cp.subs.map((sv, xi) => leaf(f, ri+1, ci+1, xi+1, sv)).join(sp(enc.s))).join(sp(enc.c))).join(sp(enc.r));
    h += '</span>';
  }
  if(diff && diff.extra) for(const k of diff.extra) h += sp(enc.f) + `<span class="lf df em" data-k="${side}:${si}:${k}"></span>`;
  return h;
}

function renderMsgSelect(){

  } else sel.classList.add('hidden');

function chip(label, val, note, cls){
  if(val === '' || val == null) return '';
  return `<div class="chip${cls ? ' ' + cls : ''}"><b>${esc(label)}</b><span>${esc(val)}</span>${note ? `<small>${esc(note)}</small>` : ''}</div>`;
}
function versionChip(msg){
  const det = detectedVersion(msg);
  if(settings.version !== 'auto') return chip(t('c_version'), settings.version, t('ver_manual') + (det && det !== settings.version ? ' · ' + t('ver_differs', det) : ''), det && det !== settings.version ? 'warn' : '');
  if(!det) return chip(t('c_version'), '2.5', t('ver_missing'), 'warn');
  return chip(t('c_version'), det, t('ver_from_msh'));
}
function regionChip(msg){
  const r = regionOf(msg);
  if(!r.code) return settings.region === 'INT' ? chip(t('c_region'), t('reg_INT'), '') : '';
  const via = { msh17:t('reg_via_msh17'), msh12:t('reg_via_msh12'), oid:t('reg_via_oid'), manual:t('reg_manual') }[r.via] || '';
  return chip(t('c_region'), t('reg_' + r.code), via);
}
function summaryChips(msg){
  let h = '';
  const msh = mshOf(msg);
  if(msh){
    const v = (f, c) => getVal(msh, f, 1, c ?? null, null);
    const m76 = TABLES['0076'][v(9,1)], m03 = TABLES['0003'][v(9,2)];
    h += chip(t('c_type'), v(9), [m76 && L(m76), m03 && L(m03)].filter(Boolean).join(' – '));
    h += versionChip(msg);
    h += regionChip(msg);
    h += chip(t('c_ctrl'), v(10));
    h += chip(t('c_time'), fmtDate(v(7,1)) || v(7,1));
    h += chip(t('c_sender'), [v(3,1), v(4,1)].filter(Boolean).join(' @ '));
    h += chip(t('c_receiver'), [v(5,1), v(6,1)].filter(Boolean).join(' @ '));
    const pr = TABLES['0103'][v(11,1)];
    h += chip(t('c_proc'), v(11,1), pr ? L(pr) : '');
    h += chip(t('c_charset'), v(18));
  } else {
    h += chip(t('c_note'), t('no_msh'), t('no_msh_n'), 'warn');
    h += versionChip(msg) + regionChip(msg);
  }
  const ids = scanIds(msg);
  if(ids.length){
    const bad = ids.filter(x => !x.id.res.ok);
    if(bad.length) h += chip(t('c_ids'), t('ids_bad', bad.length), bad.map(x => fmtPath(segLabel(x.seg, true), x.f, x.multiRep ? x.r : null, null, null)).join(', '), 'warn');
    else h += chip(t('c_ids'), t('ids_ok', ids.length), ids.map(x => IDSYS[x.id.kind][settings.lang].replace(/\s*\(.*\)/, '')).filter((v, i, a) => a.indexOf(v) === i).join(', '), 'good');
  }
  const segCounts = Object.entries(msg.counts).map(([k, n]) => n > 1 ? k + '×' + n : k).join(' ');
  h += chip(t('c_segments'), String(msg.segs.length), segCounts);
  const badLines = msg.segs.filter(s => s.invalid).length;
  if(badLines) h += chip(t('c_warn'), t('bad_lines', badLines), t('bad_lines_n'), 'warn');
  return h;
}
function renderChips(){ $('#chips').innerHTML = state.msg ? summaryChips(state.msg) : ''; }

function renderRaw(){
  const box = $('#viewRaw'); const msg = state.msg;
  if(!msg){ box.innerHTML = `<div class="empty-state"><b>${esc(t('empty_title'))}</b><br>${t('empty_body')}</div>`; return; }
  box.innerHTML = msg.segs.map((seg, si) => `<div class="ln"><div class="no">${si + 1}</div><div class="tx">${segHTML(seg, si, 'x', msg.enc, null, settings.fieldNums)}</div></div>`).join('');
  applyHighlight();
}

function allLeaves(msg){
  const out = [];
  msg.segs.forEach((seg, si) => {
    if(seg.invalid) return;
    for(let f = 1; f < seg.fields.length; f++){
      const fd = seg.fields[f]; if(!fd) continue;
      fd.reps.forEach((rp, ri) => rp.comps.forEach((cp, ci) => cp.subs.forEach((sv, xi) => {
        if(sv === '') return;
        const ls = leafSel([seg], f, ri + 1, ci + 1, xi + 1);
        out.push({ si, seg, f, r: ri + 1, c: ls.c, s: ls.s, path: fmtPath(segLabel(seg, true), f, ls.showRep ? ri + 1 : null, ls.c, ls.s), name: shortName(seg, f, ls.c, ls.s), value: sv });
      })));
    }
  });
  return out;
}
function renderList(){
  const box = $('#listBody'); const msg = state.msg;
  if(!msg){ box.innerHTML = ''; return; }
  const q = $('#listFilter').value.trim().toLowerCase();
  const rows = allLeaves(msg).filter(x => !q || x.path.toLowerCase().includes(q) || x.name.toLowerCase().includes(q) || x.value.toLowerCase().includes(q));
  const cur = state.sel;
  box.innerHTML = `<table class="t"><thead><tr><th>${esc(t('th_path'))}</th><th>${esc(t('th_name'))}</th><th>${esc(t('th_value'))}</th></tr></thead><tbody>` +
    rows.map(x => {
      const isCur = cur && cur.si === x.si && cur.f === x.f && cur.r === x.r && cur.c === x.c && cur.s === x.s;
      const v = x.value.length > 200 ? x.value.slice(0, 200) + '…' : x.value;
      return `<tr data-pick="${x.si}:${x.f}:${x.r}:${x.c ?? ''}:${x.s ?? ''}"${isCur ? ' class="cur"' : ''}><td class="p">${esc(x.path)}</td><td>${esc(x.name)}</td><td class="v">${esc(v)}</td></tr>`;
    }).join('') + `</tbody></table>` + (rows.length ? '' : `<div class="empty-state">${esc(t('no_results'))}</div>`);
}

function applyHighlight(){
  const root = $('#viewRaw');
  $$('.lf.sel', root).forEach(e => e.classList.remove('sel'));
  $$('.fd.sf', root).forEach(e => e.classList.remove('sf'));
  const s = state.sel; if(!s || s.f == null) return null;
  const fdEl = root.querySelector(`.fd[data-f="x:${s.si}:${s.f}"]`); if(fdEl) fdEl.classList.add('sf');
  let prefix = `x:${s.si}:${s.f}:`;
  if(s.r != null){ prefix += s.r + ':'; if(s.c != null){ prefix += s.c + ':'; if(s.s != null) prefix += s.s; } }
  const els = $$(s.s != null ? `.lf[data-k="${prefix}"]` : `.lf[data-k^="${prefix}"]`, root);
  els.forEach(e => e.classList.add('sel'));
  return els[0];
}
function select(sel, scroll){
  state.sel = sel;
  const first = applyHighlight();
  if(scroll && first && state.view === 'raw') first.scrollIntoView({ block:'center', behavior:'smooth' });
  if(state.view === 'list') renderList();
  renderInspector();
}

/* ---------- Inspector (Analyze) ---------- */
function crumbHTML(seg, f, c, s){
  const d = describe(seg, f, c, s);
  const tcode = ty => ty ? `<code title="${esc(dtName(ty))}">${esc(ty)}</code>` : '';
  let h = `<div class="crumb"><div class="lvl"><span class="n">${seg.name}</span><span>${esc(d.segDesc)}</span></div>`;
  h += `<div class="lvl${c == null ? ' leaf' : ''}"><span class="n">${f}</span><span>${esc(d.field ? d.field.name : t('field_undef', f))} ${tcode(d.field && d.field.type)}</span></div>`;
  if(c != null) h += `<div class="lvl${s == null ? ' leaf' : ''}"><span class="n">.${c}</span><span>${esc(d.comp ? d.comp.name : t('comp_n', c))} ${tcode(d.comp && d.comp.type)}</span></div>`;
  if(s != null) h += `<div class="lvl leaf"><span class="n">.${s}</span><span>${esc(d.sub ? d.sub.name : t('sub_n', s))} ${tcode(d.sub && d.sub.type)}</span></div>`;
  return h + `</div>`;
}
function interpretHTML(seg, sel){
  const d = describe(seg, sel.f, sel.c, sel.s);
  const val = getVal(seg, sel.f, sel.r, sel.c, sel.s);
  const leafv = getVal(seg, sel.f, sel.r || 1, sel.c || 1, sel.s || 1);
  const rows = [];
  const ty = leafType(d, sel.c, sel.s);
  if(ty) rows.push([t('dtype'), esc(ty + (dtName(ty) ? ' – ' + dtName(ty) : ''))]);
  if(['DTM','DT','TS'].includes(ty) && leafv){ const fd = fmtDate(leafv); if(fd) rows.push([t('datetime'), esc(fd)]); }
  const tl = tableLookup(seg, sel.f, sel.c, leafv);
  if(tl && leafv) rows.push([t('table', tl.table) + (tl.src ? ' · ' + tl.src : ''), esc(tl.text ? leafv.trim() + ' = ' + tl.text : leafv.trim() + ' (' + t('not_in_table') + ')')]);
  const id = identifyId(seg, sel.f, sel.r || 1);
  if(id){
    const via = id.via === 'oid' ? t('id_via_oid', id.viaArg) : id.via === 'code' ? t('id_via_code', id.viaArg) : t('id_via_fmt');
    rows.push([t('id_label'), `<span class="sans">${esc(IDSYS[id.kind][settings.lang])}</span><br>${idResultText(id.res)}<br><span style="color:var(--muted)">${esc(via)}</span>`]);
  }
  rows.push([t('length'), esc(t('chars', val.length))]);
  const fdd = seg.fields[sel.f];
  if(fdd && fdd.reps.length > 1) rows.push([t('reps'), esc(fdd.reps.length + (sel.r ? ' (' + t('shown', sel.r) + ')' : ''))]);
  rows.push([t('position'), esc(t('line', sel.si + 1) + (seg.multi ? ' · ' + t('occ_of', seg.name, seg.occ, seg.msg.counts[seg.name]) : ''))]);
  rows.push([t('ver_def'), esc(t('ver_def_v', verOf(seg.msg)))]);
  let h = `<dl class="kv">` + rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join('') + `</dl>`;
  if(seg.name === 'OBX' && sel.f === 5 && getVal(seg, 2, 1, 1, 1).trim() === 'ED'){
    const r = sel.r || 1; const data = getVal(seg, 5, r, 5, null);
    if(data) h += `<div style="margin-top:10px"><button class="btn sm" data-ed="${sel.si}:${r}">${esc(t('download_ed', (getVal(seg,5,r,2,null) + '/' + getVal(seg,5,r,3,null)).toLowerCase()))}</button></div>`;
  }
  return h;
}
function valueBox(val, enc, cls){
  if(val === '') return `<pre class="val empty${cls ? ' ' + cls : ''}">${esc(t('empty'))}</pre>`;
  const dec = decodeEsc(val, enc);
  let h = `<pre class="val${cls ? ' ' + cls : ''}">${esc(val)}</pre>`;
  if(dec !== val) h += `<div class="hint" style="margin:6px 0 3px">${esc(t('decoded'))}</div><pre class="val${cls ? ' ' + cls : ''}">${esc(dec)}</pre>`;
  return h;
}
const hideEmptyBox = () => `<label class="chk r"><input type="checkbox" data-hide-empty ${settings.hideEmpty ? 'checked' : ''}> ${esc(t('hide_empty'))}</label>`;
function breakdownHTML(seg, sel){
  const fd = seg.fields[sel.f]; if(!fd || fd.special) return '';
  const d = describe(seg, sel.f, null, null);
  const ver = verOf(seg.msg);
  const defs = d.field && DT[d.field.type] || [];
  if(!fd.reps.some(rp => rp.comps.length > 1) && !defs.length) return '';
  const multi = fd.reps.length > 1;
  let h = `<div class="ib"><h4>${esc(t('structure', fmtPath(seg.name, sel.f, null, null, null)))} ${d.field ? '<span style="text-transform:none;letter-spacing:0;font-weight:500">' + esc(d.field.type) + '</span>' : ''}${hideEmptyBox()}</h4><table class="t"><tbody>`;
  fd.reps.forEach((rp, ri) => {
    const r = ri + 1;
    if(multi) h += `<tr><td colspan="3" style="font-weight:600;color:var(--muted);font-size:11px;padding-top:8px;text-transform:uppercase">${esc(t('repetition', r))}</td></tr>`;
    const n = Math.max(defs.length, rp.comps.length);
    for(let c = 1; c <= n; c++){
      const cp = rp.comps[c-1]; const v = cp ? cp.raw : '';
      const cd = splitDef(defs[c-1]); if(cd) cd.type = mapType(cd.type, ver);
      if(settings.hideEmpty && v === '') continue;
      const isCur = sel.r === r && sel.c === c && sel.s == null;
      const subDefs = cd && DT[cd.type] || [];
      h += `<tr data-pick="${sel.si}:${sel.f}:${r}:${c}:" class="${isCur ? 'cur' : ''}${v === '' ? ' mt' : ''}"><td class="p">${esc(fmtPath(seg.name, sel.f, multi ? r : null, c, null))}</td><td>${esc(cd ? cd.name : '—')} <span class="ty">${esc(cd ? cd.type : '')}</span></td><td class="v">${esc(v.length > 120 ? v.slice(0, 120) + '…' : v)}</td></tr>`;
      if(cp && cp.subs.length > 1){
        cp.subs.forEach((sv, xi) => {
          const s = xi + 1; if(settings.hideEmpty && sv === '') return;
          const sdf = splitDef(subDefs[xi]);
          const isCurS = sel.r === r && sel.c === c && sel.s === s;
          h += `<tr class="sub${isCurS ? ' cur' : ''}${sv === '' ? ' mt' : ''}" data-pick="${sel.si}:${sel.f}:${r}:${c}:${s}"><td class="p">${esc(fmtPath(seg.name, sel.f, multi ? r : null, c, s))}</td><td>${esc(sdf ? sdf.name : '—')}</td><td class="v">${esc(sv)}</td></tr>`;
        });
      }
    }
  });
  return h + `</tbody></table></div>`;
}
function segTableHTML(seg, si, curF){
  if(seg.invalid) return '';
  const sd = SEGS[seg.name]; const ver = verOf(seg.msg);
  const n = Math.max(sd ? sd.f.length : 0, seg.fields.length - 1);
  let h = `<div class="ib"><h4>${esc(t('seg_all', segLabel(seg, true)))}${hideEmptyBox()}</h4><div class="hint" style="margin:-4px 0 8px">${esc(segDesc(seg.name))}</div><table class="t"><tbody>`;
  for(let f = 1; f <= n; f++){
    const fd = seg.fields[f]; const v = fd ? fd.raw : '';
    if(settings.hideEmpty && v === '' && f !== curF) continue;
    const def = sd && splitDef(sd.f[f-1]);
    let type = def ? mapType(def.type, ver) : '';
    if(seg.name === 'OBX' && f === 5){ const vt = getVal(seg, 2, 1, 1, 1).trim(); if(vt) type = mapType(vt, ver); }
    h += `<tr data-pick="${si}:${f}:::" class="${f === curF ? 'cur' : (v === '' ? 'mt' : '')}"><td class="p">${esc(fmtPath(seg.name, f, null, null, null))}</td><td>${esc(def ? def.name : '—')} <span class="ty">${esc(type)}</span></td><td class="v">${esc(v.length > 120 ? v.slice(0, 120) + '…' : v)}</td></tr>`;
  }
  return h + `</tbody></table></div>`;
}
function renderInspector(){
  const box = $('#inspBody'); const msg = state.msg; const sel = state.sel;
  if(!msg){ box.innerHTML = ''; return; }
  if(!sel){ box.innerHTML = `<div class="ib"><div class="hint">${t('insp_hint')}</div></div>`; return; }
  const seg = msg.segs[sel.si];
  if(sel.f == null){ box.innerHTML = segTableHTML(seg, sel.si, null); return; }
  const fd = seg.fields[sel.f];
  const showRep = fd && fd.reps.length > 1 && sel.r != null;
  const path = fmtPath(seg.name, sel.f, showRep ? sel.r : null, sel.c, sel.s);
  const full = fmtPath(segLabel(seg, true), sel.f, showRep ? sel.r : null, sel.c, sel.s);
  const val = getVal(seg, sel.f, sel.r, sel.c, sel.s);
  let h = `<div class="ib"><div class="path"><div class="big">${esc(path)}</div><button class="btn sm" data-copy="${esc(path)}">${esc(t('copy_path'))}</button></div>`;
  if(full !== path) h += `<div class="alt">${esc(t('unique'))} ${esc(full)}</div>`;

/* ---------- Path search ---------- */
const QRE = /^\s*([A-Za-z][A-Za-z0-9]{2})\s*(?:\[(\d+)\]|\((\d+)\))?\s*(?:[-.]?\s*(\d+)(?:\[(\d+)\]|\((\d+)\))?(?:\.(\d+))?(?:\.(\d+))?)?\s*$/;
function parsePath(q){
  const m = QRE.exec(q); if(!m) return null;
  const num = x => x == null ? null : +x;
  return { seg: m[1].toUpperCase(), occ: num(m[2] ?? m[3]), f: num(m[4]), r: num(m[5] ?? m[6]), c: num(m[7]), s: num(m[8]) };
}
function runQuery(){
  const q = $('#query').value.trim(); const box = $('#qres'); const msg = state.msg;
  $$('#viewRaw .lf.hit').forEach(e => e.classList.remove('hit'));
  if(!q || !msg){ box.innerHTML = q ? '' : `<div class="hint">${t('q_hint')}</div>`; return; }
  const p = parsePath(q);
  if(!p){ box.innerHTML = `<div class="hint">${t('q_bad')}</div>`; return; }
  const res = [];
  msg.segs.forEach((seg, si) => {
    if(seg.name !== p.seg || (p.occ && seg.occ !== p.occ)) return;
    if(p.f == null){ res.push({ pick:`${si}::::`, path: segLabel(seg, true), val: seg.line }); return; }
    const fd = seg.fields[p.f];
    const reps = p.r != null ? [p.r] : (p.c == null ? [null] : (fd ? fd.reps.map((_, i) => i + 1) : [1]));
    reps.forEach(r => {
      const showRep = r != null && ((fd && fd.reps.length > 1) || r > 1);
      res.push({ pick:`${si}:${p.f}:${r ?? ''}:${p.c ?? ''}:${p.s ?? ''}`, path: fmtPath(segLabel(seg, true), p.f, showRep ? r : null, p.c, p.s), val: getVal(seg, p.f, r, p.c, p.s) });
      let prefix = `x:${si}:${p.f}:`; if(r != null){ prefix += r + ':'; if(p.c != null){ prefix += p.c + ':'; if(p.s != null) prefix += p.s; } }
      $$(p.s != null && r != null ? `#viewRaw .lf[data-k="${prefix}"]` : `#viewRaw .lf[data-k^="${prefix}"]`).forEach(e => e.classList.add('hit'));
    });
  });
  if(!res.length){ box.innerHTML = `<div class="hint">${t('q_none', esc(p.seg) + (p.occ ? ' #' + p.occ : ''))}</div>`; return; }
  const firstSeg = msg.segs.find(s => s.name === p.seg);
  const name = firstSeg && p.f != null ? `<div class="hint" style="margin-bottom:4px">${esc(shortName(firstSeg, p.f, p.c, p.s))}</div>` : `<div class="hint" style="margin-bottom:4px">${esc(segDesc(p.seg))}</div>`;
  box.innerHTML = name + res.slice(0, 200).map(x => `<div data-pick="${x.pick}"><span class="p">${esc(x.path)}</span><span class="v">${x.val === '' ? `<i style="color:var(--faint)">${esc(t('empty'))}</i>` : esc(x.val.length > 160 ? x.val.slice(0, 160) + '…' : x.val)}</span></div>`).join('');
}
function parsePick(str){ const [si, f, r, c, s] = str.split(':').map(x => x === '' ? null : +x); return { si, f, r, c, s }; }
function exportJson(){

   COMPARE
   ===================================================================== */
function parseIgnore(){
  const set = new Set(); if(!settings.ignoreOn) return set;
  settings.ignore.split(/[,;\s]+/).forEach(x => { const p = parsePath(x); if(p && p.f != null) set.add(p.seg + '-' + p.f + (p.c != null ? '.' + p.c : '')); });
  return set;
}
function fieldSim(a, b){
  const n = Math.max(a.fields.length, b.fields.length) - 1; if(n <= 0) return 1;
  let eq = 0; for(let f = 1; f <= n; f++) if((a.fields[f] ? a.fields[f].raw : '') === (b.fields[f] ? b.fields[f].raw : '')) eq++;
  return eq / n;
}
function alignSegs(A, B){
  const n = A.length, m = B.length;
  const sim = Array.from({ length:n }, (_, i) => Array.from({ length:m }, (_, j) => A[i].name === B[j].name && !A[i].invalid ? 1 + fieldSim(A[i], B[j]) : -1));
  const dp = Array.from({ length:n + 1 }, () => new Float64Array(m + 1));
  for(let i = n - 1; i >= 0; i--) for(let j = m - 1; j >= 0; j--){
    let best = Math.max(dp[i+1][j], dp[i][j+1]);
    if(sim[i][j] >= 0) best = Math.max(best, sim[i][j] + dp[i+1][j+1]);
    dp[i][j] = best;
  }
  const rows = []; let i = 0, j = 0;
  while(i < n || j < m){
    if(i < n && j < m && sim[i][j] >= 0 && dp[i][j] === sim[i][j] + dp[i+1][j+1]){ rows.push({ ai:i, bi:j }); i++; j++; }
    else if(i < n && (j >= m || dp[i][j] === dp[i+1][j])){ rows.push({ ai:i, bi:null }); i++; }
    else { rows.push({ ai:null, bi:j }); j++; }
  }
  return rows;
}
function diffSegs(a, b, ignore){
  const leaves = new Set(), list = [], extraA = [], extraB = [];
  const nf = Math.max(a.fields.length, b.fields.length);
  for(let f = 1; f < nf; f++){
    if(ignore.has(a.name + '-' + f)) continue;
    const fa = a.fields[f], fb = b.fields[f];
    if((fa ? fa.raw : '') === (fb ? fb.raw : '')) continue;
    const nr = Math.max(fa ? fa.reps.length : 0, fb ? fb.reps.length : 0);
    for(let r = 1; r <= nr; r++){
      const ra = fa && fa.reps[r-1], rb = fb && fb.reps[r-1];
      const nc = Math.max(ra ? ra.comps.length : 0, rb ? rb.comps.length : 0);
      for(let c = 1; c <= nc; c++){
        if(ignore.has(a.name + '-' + f + '.' + c)) continue;
        const ca = ra && ra.comps[c-1], cb = rb && rb.comps[c-1];
        const ns = Math.max(ca ? ca.subs.length : 0, cb ? cb.subs.length : 0);
        for(let s = 1; s <= ns; s++){
          const va = ca ? (ca.subs[s-1] ?? '') : '', vb = cb ? (cb.subs[s-1] ?? '') : '';
          if(va !== vb){ const key = f + ':' + r + ':' + c + ':' + s; leaves.add(key); list.push({ f, r, c, s, va, vb }); if(!fa) extraA.push(key); if(!fb) extraB.push(key); }
        }
      }
    }
  }
  return { leaves, list, extraA, extraB };
}
function runCompare(){
  const ta = $('#cmpA').value, tb = $('#cmpB').value;
  state.cmpSel = null;
  if(!ta.trim() || !tb.trim()){
    state.cmp = null; $('#cmpChips').innerHTML = '';
    $('#cmpView').innerHTML = `<div class="empty-state"><b>${esc(t('cmp_empty_t'))}</b><br>${t('cmp_empty_b')}</div>`;
    renderCmpInspector(); return;
  }
  const A = splitMessages(ta)[0], B = splitMessages(tb)[0];
  const ignore = parseIgnore();
  const rows = alignSegs(A.segs, B.segs);
  const mapA = {}, mapB = {};
  rows.forEach((row, i) => {
    if(row.ai != null) mapA[row.ai] = i;
    if(row.bi != null) mapB[row.bi] = i;
    if(row.ai != null && row.bi != null){ row.diff = diffSegs(A.segs[row.ai], B.segs[row.bi], ignore); row.kind = row.diff.list.length ? 'diff' : 'same'; }
    else row.kind = row.ai != null ? 'onlyA' : 'onlyB';

  renderCmpChips(); renderCmpView(); renderCmpInspector();
}
function renderCmpChips(){

    try{
      const raw = decodeEsc(getVal(seg, 5, r, 5, null), state.msg.enc).replace(/\s+/g, '');
      const bin = atob(raw); const bytes = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      let t1 = getVal(seg, 5, r, 2, null).toLowerCase(), t2 = getVal(seg, 5, r, 3, null).toLowerCase();
      if(t1 === 'ap') t1 = 'application'; if(t1 === 'im') t1 = 'image'; if(t1 === 'tx') t1 = 'text';
      const blob = new Blob([bytes], { type: t1 && t2 ? t1 + '/' + t2 : 'application/octet-stream' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'obx5_attachment' + (t2 ? '.' + t2 : '.bin'); a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }catch(err){ toast(t('not_b64')); }
  }
});
document.addEventListener('change', e => { if(e.target.matches('[data-hide-empty]')){ settings.hideEmpty = e.target.checked; saveSettings(); renderInspector(); } });
document.addEventListener('keydown', e => {
  if(e.key !== 'Escape' || e.target.matches('textarea,input')) return;
  if(!$('#pop').classList.contains('hidden')){ $('#pop').classList.add('hidden'); $('#gearBtn').classList.remove('on'); return; }
  if(!$('#view-analyze').classList.contains('hidden')) select(null); else { state.cmpSel = null; applyCmpHighlight(); renderCmpInspector(); }
});

// tooltip
const tip = $('#tip');
function showTip(e, html){ tip.innerHTML = html; tip.style.display = 'block'; moveTip(e); }
function moveTip(e){
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 16;
  if(x + w > innerWidth - 8) x = innerWidth - w - 8;
  if(y + h > innerHeight - 8) y = e.clientY - h - 12;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function tipFor(lf){
  const [side, si, f, r, c, s] = lf.dataset.k.split(':');
  let seg, segs;
  if(side === 'x'){ seg = state.msg.segs[+si]; segs = [seg]; }
  else {
    const cm = state.cmp; const row = cm.rows[side === 'a' ? cm.mapA[+si] : cm.mapB[+si]];
    const sa = row.ai != null ? cm.A.segs[row.ai] : null, sb = row.bi != null ? cm.B.segs[row.bi] : null;
    seg = side === 'a' ? sa : sb; segs = [sa, sb].filter(Boolean);
  }
  const ls = leafSel(segs, +f, +r, +c, +s);
  const path = fmtPath(segLabel(seg, true), +f, ls.showRep ? +r : null, ls.c, ls.s);
  const v = getVal(seg, +f, +r, +c, +s);
  return `<div class="tp">${esc(path)}</div><div class="tn">${esc(shortName(seg, +f, ls.c, ls.s))}</div>${v ? `<div class="tv">${esc(v.length > 140 ? v.slice(0, 140) + '…' : v)}</div>` : ''}`;
}
['#viewRaw', '#cmpView'].forEach(id => {
  const el = $(id);
  el.addEventListener('mouseover', e => {
    const lf = e.target.closest('.lf');
    if(lf && lf.dataset.k.split(':').length === 6) showTip(e, tipFor(lf));
    else { const sg = e.target.closest('.sg'); if(sg) showTip(e, `<div class="tp">${esc(sg.textContent)}</div><div class="tn">${esc(segDesc(sg.textContent))}</div>`); }
  });
  el.addEventListener('mousemove', e => { if(tip.style.display === 'block') moveTip(e); });
  el.addEventListener('mouseout', e => { if(!e.relatedTarget || !el.contains(e.relatedTarget) || !(e.relatedTarget.closest('.lf') || e.relatedTarget.closest('.sg'))) tip.style.display = 'none'; });
});

// compare
const cmpDeb = debounce(runCompare, 200);
$('#cmpA').addEventListener('input', cmpDeb);
$('#cmpB').addEventListener('input', cmpDeb);
$('#cmpSample').addEventListener('click', () => { $('#cmpA').value = SAMPLES.oruCH.replace(/\r/g, '\n'); $('#cmpB').value = SAMPLES.oruCH_B.replace(/\r/g, '\n'); runCompare(); });
$('#cmpSwap').addEventListener('click', () => { const a = $('#cmpA').value; $('#cmpA').value = $('#cmpB').value; $('#cmpB').value = a; runCompare(); });
$('#cmpClear').addEventListener('click', () => { $('#cmpA').value = ''; $('#cmpB').value = ''; runCompare(); });
$('#onlyDiff').addEventListener('change', e => { settings.onlyDiff = e.target.checked; saveSettings(); $('#cmpView').classList.toggle('only', settings.onlyDiff); });
$('#ignoreOn').addEventListener('change', e => { settings.ignoreOn = e.target.checked; saveSettings(); runCompare(); });
$('#ignoreList').addEventListener('input', debounce(e => { settings.ignore = e.target.value; saveSettings(); runCompare(); }, 300));
$('#cmpView').addEventListener('click', e => {
  const lf = e.target.closest('.lf'); if(!lf) return;
  const parts = lf.dataset.k.split(':'); if(parts.length < 6) return;
  const [side, si, f, r, c, s] = parts; const cm = state.cmp;
  const rowIdx = side === 'a' ? cm.mapA[+si] : cm.mapB[+si]; const row = cm.rows[rowIdx];
  const segs = [row.ai != null ? cm.A.segs[row.ai] : null, row.bi != null ? cm.B.segs[row.bi] : null].filter(Boolean);
  const ls = leafSel(segs, +f, +r, +c, +s);
  cmpSelect({ row:rowIdx, f:+f, r:+r, c:ls.c, s:ls.s }, false);
});
$('#cmpInsp').addEventListener('click', e => {
  const d = e.target.closest('[data-dpick]'); if(!d) return;
  const en = state.cmpEntries[+d.dataset.dpick];
  if(en.kind === 'chg') cmpSelect({ row:en.row, f:en.f, r:en.r, c:en.c, s:en.s }, true);
  else { state.cmpSel = null; applyCmpHighlight(); renderCmpInspector(); const el = $(`#cmpView .crow[data-row="${en.row}"]`); if(el) el.scrollIntoView({ block:'center', behavior:'smooth' }); }
});

/* init */
loadSettings();
$('#notation').value = settings.notation;
$('#region').value = settings.region;
$('#fieldNums').checked = settings.fieldNums;
$('#onlyDiff').checked = settings.onlyDiff;
$('#ignoreOn').checked = settings.ignoreOn;
$('#ignoreList').value = settings.ignore;
applyStatic();
analyze();
runCompare();
</script>
